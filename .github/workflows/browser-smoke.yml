name: PhotoMosaic Browser Smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start app
        run: python3 -m http.server 4173 >/tmp/photomosaic-http.log 2>&1 &
      - name: Run split-flow smoke tests
        run: npx playwright test qa/split-flows.spec.js --reporter=line
