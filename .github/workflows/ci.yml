name: PhotoMosaic CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: photomosaic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check studio-mode.js
          node --check selection-controls.js
          node --check mosaic-engine.js
          node --check shape-engine.js
          node --check custom-shape-ui.js
          node --check generation-controller.js
          node --check service-worker.js
          node --check scripts/build-mobile.mjs
          node --check scripts/configure-ios-assets.mjs
      - name: Test shape engine
        run: node --test tests/shape-engine.test.mjs
      - name: Test mosaic engine
        run: node --test tests/mosaic-engine.test.mjs
      - name: Test generation lifecycle
        run: node --test tests/generation-controller.test.mjs
      - name: Test native release configuration
        run: node --test tests/native-release.test.mjs
      - name: Build public site
        run: node scripts/build-site.mjs
      - name: Verify minimal publication artifact
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/studio.html
          test -s dist/studio-mode.js
          test -s dist/app.js
          test -s dist/selection-controls.js
          test -s dist/mosaic-engine.js
          test -s dist/generation-controller.js
          test -s dist/custom-shape-ui.js
          test -s dist/custom-shape.css
          test -s dist/service-worker.js
          test -s dist/icons/icon-192.png
          test -s dist/icons/icon-512.png
          test -f dist/.nojekyll
          test ! -e dist/tests
          test ! -e dist/.github
          cmp --silent index.html dist/index.html
          cmp --silent studio.html dist/studio.html
          cmp --silent app.js dist/app.js
          cmp --silent selection-controls.js dist/selection-controls.js
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Verify application shell
        shell: bash
        run: |
          test -s index.html
          test -s studio.html
          test -s studio-mode.js
          test -s styles.css
          test -s app.js
          test -s selection-controls.js
          test -s mosaic-engine.js
          test -s shape-engine.js
          test -s generation-controller.js
          test -s custom-shape-ui.js
          test -s custom-shape.css
          test -s service-worker.js
          test -s manifest.webmanifest
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          grep -q 'studio.html?mode=rectangle' index.html
          grep -q 'studio.html?mode=shape' index.html
          grep -q 'id="target"' studio.html
          grep -q 'id="tiles"' studio.html
          grep -q 'id="cancel"' studio.html
          grep -q 'multiple' studio.html
          grep -q 'navigator.canShare' app.js
          grep -q 'selection-controls.js' studio.html
          grep -q 'studio-mode.js' studio.html
          grep -q 'trimSelection' shape-engine.js
          grep -q 'const neighbours' shape-engine.js
          grep -q 'Forma para pared' index.html
          grep -q 'customMissing' app.js
          grep -q "butterfly: { label: 'Mariposa'" shape-engine.js
          grep -q 'value="clover"' studio.html
          grep -q 'id="downloadCsv"' studio.html
          grep -q 'installationGuideSvg' shape-engine.js
          grep -q 'shape-trim' selection-controls.js
          grep -q "'./selection-controls.js'" service-worker.js
          grep -q 'id="exportFormat"' studio.html
          grep -q 'id="mosaicMode"' studio.html
          grep -q 'id="shape"' studio.html
          grep -q 'shape-engine.js' studio.html
          grep -q 'custom-shape-ui.js' studio.html
          grep -q "'./studio.html'" service-worker.js
          grep -q "'./studio-mode.js'" service-worker.js
          grep -q "'./shape-engine.js'" service-worker.js
          grep -q "'./custom-shape-ui.js'" service-worker.js
          grep -q "image/png" mosaic-engine.js
          grep -q 'generation-controller.js' studio.html
          grep -q "'./generation-controller.js'" service-worker.js
