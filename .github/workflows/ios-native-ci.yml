name: PhotoMosaic iOS Native CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'support.html'
      - 'PrivacyInfo.xcprivacy'
      - '*.js'
      - '*.css'
      - 'icons/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'ios-release.json'
      - 'app-store/**'
      - 'scripts/build-mobile.mjs'
      - 'scripts/configure-ios-assets.mjs'
      - 'scripts/validate-ios-release.mjs'
      - '.github/workflows/ios-native-ci.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'support.html'
      - 'PrivacyInfo.xcprivacy'
      - '*.js'
      - '*.css'
      - 'icons/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'ios-release.json'
      - 'app-store/**'
      - 'scripts/build-mobile.mjs'
      - 'scripts/configure-ios-assets.mjs'
      - 'scripts/validate-ios-release.mjs'
      - '.github/workflows/ios-native-ci.yml'

permissions:
  contents: read

concurrency:
  group: photomosaic-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          test "${SDK_VERSION%%.*}" -ge 26
      - name: Install Capacitor
        run: npm ci --no-audit --no-fund
      - name: Run complete test suite
        run: npm test
      - name: Validate App Store release identity
        run: npm run ios:release:check
      - name: Build bundled web assets
        run: npm run build:mobile
      - name: Generate native iOS project
        run: npx cap add ios
      - name: Install PhotoMosaic native assets and privacy manifest
        run: npm run ios:assets
      - name: Validate Capacitor configuration
        run: npx cap doctor ios
      - name: Compile Release for iOS Simulator without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Validate release identity, version and privacy
        id: app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Build/Products/Release-iphonesimulator/App.app' -print -quit)"
          test -n "$APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          PRIVACY="$APP_PATH/PrivacyInfo.xcprivacy"
          EXPECTED_BUNDLE_ID="$(node -p "require('./ios-release.json').bundleId")"
          EXPECTED_DISPLAY_NAME="$(node -p "require('./ios-release.json').displayName")"
          EXPECTED_VERSION="$(node -p "require('./ios-release.json').marketingVersion")"
          EXPECTED_BUILD="$(node -p "require('./ios-release.json').buildNumber")"
          EXPECTED_MINIMUM_IOS="$(node -p "require('./ios-release.json').minimumIOSVersion")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          MINIMUM_IOS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")"
          test "$BUNDLE_ID" = "$EXPECTED_BUNDLE_ID"
          test "$DISPLAY_NAME" = "$EXPECTED_DISPLAY_NAME"
          test "$VERSION" = "$EXPECTED_VERSION"
          test "$BUILD" = "$EXPECTED_BUILD"
          test "$MINIMUM_IOS" = "$EXPECTED_MINIMUM_IOS"
          test -f "$APP_PATH/public/privacy.html"
          test -f "$APP_PATH/public/support.html"
          test -f "$PRIVACY"
          plutil -lint "$PRIVACY"
          test "$(plutil -extract NSPrivacyTracking raw -o - "$PRIVACY")" = 'false'
          test "$(plutil -extract NSPrivacyCollectedDataTypes json -o - "$PRIVACY")" = '[]'
          echo "Bundle ID: $BUNDLE_ID"
          echo "Release: $DISPLAY_NAME $VERSION ($BUILD), iOS $MINIMUM_IOS+"
          echo "Privacy manifest: valid"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
      - name: Stage simulator artifact
        shell: bash
        run: |
          mkdir artifact
          cp -R "${{ steps.app.outputs.path }}" artifact/PhotoMosaic.app
      - name: Upload simulator application
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMosaic-iOS-Simulator-${{ github.sha }}
          path: artifact/PhotoMosaic.app
          if-no-files-found: error
          retention-days: 14
