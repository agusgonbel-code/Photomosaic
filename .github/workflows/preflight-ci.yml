name: PhotoMosaic Preflight QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check project-preflight-v20.js
      - run: node --check wall-fit-v21.js
      - run: node --test tests/project-preflight-v20.test.mjs
      - run: node --test tests/wall-fit-v21.test.mjs
